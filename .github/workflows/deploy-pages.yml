name: 发布纯前端版到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 取出仓库内容
        uses: actions/checkout@v4

      - name: 准备 Pages（没开启时自动开启）
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 打包 standalone 目录
        uses: actions/upload-pages-artifact@v3
        with:
          path: standalone

      - name: 部署到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
